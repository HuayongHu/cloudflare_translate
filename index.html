  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

  <title>翻译 - Apple Style</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    /* ─── Apple HIG 官方色值与全局变量 ─── */
    :root {
      --apple-bg: #F2F2F7;         /* iOS/iPadOS 系统标准底层灰 */
      --apple-card: #FFFFFF;       /* 卡片纯白 */
      --apple-blue: #007AFF;       /* 经典 iOS 蓝 */
      --apple-blue-active: #005ecb;
      
      --text-primary: #1D1D1F;     /* Apple 专属深色文字 (不是纯黑) */
      --text-secondary: #8E8E93;   /* 系统次级灰 */
      
      --control-bg: #E5E5EA;       /* 控件背景灰 */
      --control-bg-hover: #D1D1D6;
      
      --border-radius-lg: 24px;    /* 卡片大圆角 */
      --border-radius-md: 14px;    /* 按钮中圆角 */
      --border-radius-sm: 10px;    /* 小元素圆角 */
      
      --divider: rgba(60, 60, 67, 0.12); /* 苹果标准分割线颜色 */
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
    }

    body {
      /* 调用苹果系统原生字体 San Francisco */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--apple-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── 毛玻璃导航栏 (macOS / iOS 风格) ─── */
    .nav-bar {
      position: sticky;
      top: 0;
      height: 52px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* ─── 主工作区 ─── */
    .workspace {
      flex: 1;
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* ─── 核心翻译卡片 ─── */
    .translate-container {
      background: var(--apple-card);
      border-radius: var(--border-radius-lg);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0,0,0,0.02); /* Apple 标志性的柔和深景深阴影 */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── 顶部语言控制栏 (类似 iPadOS 标签页) ─── */
    .lang-header {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 0.5px solid var(--divider);
      background: rgba(255, 255, 255, 0.9);
    }

    .lang-wrapper {
      flex: 1;
      position: relative;
    }

    /* 苹果风格的下拉菜单 */
    select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background: var(--apple-bg);
      border: none;
      outline: none;
      color: var(--apple-blue);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--border-radius-sm);
      cursor: pointer;
      text-align: center;
      text-align-last: center; /* 确保选中文字居中 */
      transition: background 0.2s;
    }

    select:hover {
      background: var(--control-bg);
    }

    /* 自定义下拉箭头 */
    .lang-wrapper::after {
      content: '\f0dc'; /* FontAwesome sort icon as arrows */
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--apple-blue);
      font-size: 12px;
      pointer-events: none;
    }

    .swap-btn {
      width: 36px;
      height: 36px;
      margin: 0 16px;
      border-radius: 50%;
      border: none;
      background: var(--control-bg);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .swap-btn:active {
      transform: scale(0.92);
      background: var(--control-bg-hover);
    }

    /* ─── 文本输入输出区 ─── */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 320px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      padding: 24px;
      position: relative;
    }

    .panel-left {
      border-right: 0.5px solid var(--divider);
    }

    /* 苹果翻译 App 喜欢用超大号纤细字体 */
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.015em;
      resize: none;
    }

    textarea::placeholder {
      color: #C7C7CC; /* iOS 标准占位符颜色 */
    }

    #outputText {
      color: var(--apple-blue); /* 输出结果用蓝色高亮是 Apple 的常见做法 */
    }

    /* ─── 底部操作工具栏 ─── */
    .panel-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }

    .action-icons {
      display: flex;
      gap: 12px;
    }

    /* 圆形毛玻璃按钮隐喻 */
    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--apple-bg);
      color: var(--apple-blue);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--control-bg);
    }

    .char-count {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ─── 主翻译按钮区 ─── */
    .action-bar {
      padding: 20px 24px;
      background: var(--apple-card);
      border-top: 0.5px solid var(--divider);
      display: flex;
      justify-content: flex-end;
    }

    /* Apple 大号药丸按钮 */
    .translate-btn {
      background-color: var(--apple-blue);
      color: #FFFFFF;
      border: none;
      border-radius: 20px; /* 药丸形状 */
      padding: 0 32px;
      height: 44px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .translate-btn:active {
      transform: scale(0.95);
      background-color: var(--apple-blue-active);
    }

    .translate-btn.success {
      background-color: #34C759; /* iOS 绿色 */
    }

    /* iOS 风格的加载圈 (简单的 CSS 模拟) */
    .loading-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    /* ─── 隐藏滚动条 (Apple 风格) ─── */
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* ─── 响应式 ─── */
    @media (max-width: 768px) {
      .workspace { padding: 20px 16px; }
      .panels { grid-template-columns: 1fr; }
      .panel-left { border-right: none; border-bottom: 0.5px solid var(--divider); }
      textarea { font-size: 20px; min-height: 160px; }
      .lang-header { padding: 12px 16px; }
      .swap-btn { transform: rotate(90deg); margin: 0 8px; }
      .swap-btn:active { transform: rotate(90deg) scale(0.92); }
      .translate-btn { width: 100%; justify-content: center; border-radius: 12px;} /* 手机端全宽按钮 */
    }
  </style>

  原生 JavaScript 逻辑 (完全保持原样，完美触发所有 API 功能)
  =========================================
  -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const inputText      = document.getElementById('inputText');
      const outputText     = document.getElementById('outputText');
      const translateBtn   = document.getElementById('translateBtn');
      const sourceLanguage = document.getElementById('sourceLanguage');
      const targetLanguage = document.getElementById('targetLanguage');
      const swapBtn        = document.getElementById('swapBtn');
      const copyBtn        = document.getElementById('copyBtn');
      const clearBtn       = document.getElementById('clearInput');
      const pasteBtn       = document.getElementById('pasteBtn');
      const listenBtn      = document.getElementById('listenBtn');
      const inputCount     = document.getElementById('inputCount');
      const outputCount    = document.getElementById('outputCount');
      const loadingSpinner = document.getElementById('loadingSpinner');

      // 字符计数
      inputText.addEventListener('input', function () {
        const length = this.value.length;
        inputCount.textContent = `${length} / 5000`;
        inputCount.style.color = length > 5000 ? '#FF3B30' : 'var(--text-secondary)'; // Apple Red
      });

      // 清除输入
      clearBtn.addEventListener('click', function () {
        inputText.value = '';
        inputCount.textContent = '0 / 5000';
        outputText.value = '';
        outputCount.textContent = '';
      });

      // 粘贴
      pasteBtn.addEventListener('click', async function () {
        try {
          const text = await navigator.clipboard.readText();
          inputText.value = text;
          inputText.dispatchEvent(new Event('input'));
        } catch (err) {
          alert('无法访问剪贴板，请手动粘贴文本。');
        }
      });

      // 复制结果
      copyBtn.addEventListener('click', async function () {
        if (outputText.value) {
          try {
            await navigator.clipboard.writeText(outputText.value);
            copyBtn.innerHTML = '<i class="fas fa-check"></i>';
            setTimeout(() => { copyBtn.innerHTML = '<i class="fas fa-copy"></i>'; }, 2000);
          } catch (err) {
            alert('复制失败，请手动复制文本。');
          }
        }
      });

      // 语音朗读
      listenBtn.addEventListener('click', function () {
        if (outputText.value && 'speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(outputText.value);
          utterance.lang = targetLanguage.value;
          speechSynthesis.speak(utterance);
        }
      });

      // 交换语言
      swapBtn.addEventListener('click', function () {
        const tempLang = sourceLanguage.value;
        sourceLanguage.value = targetLanguage.value;
        targetLanguage.value = tempLang;

        if (outputText.value) {
          const tempText = inputText.value;
          inputText.value = outputText.value;
          outputText.value = tempText;
          inputText.dispatchEvent(new Event('input'));
        }
      });

      // 翻译按钮
      translateBtn.addEventListener('click', function () { translateText(); });

      // Enter 键触发翻译
      inputText.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          translateText();
        }
      });

      // 翻译核心逻辑
      function translateText() {
        const text = inputText.value.trim();
        if (!text) return;

        const source = sourceLanguage.value;
        const target = targetLanguage.value;
        const secret = '123456'; 

        loadingSpinner.style.display = 'inline-block';
        translateBtn.querySelector('span').textContent = '翻译中...';

        fetch(`https://translateapi.011102.xyz/?text=${encodeURIComponent(text)}&source_language=${source}&target_language=${target}&secret=${secret}`)
          .then(response => response.json())
          .then(data => {
            loadingSpinner.style.display = 'none';
            translateBtn.querySelector('span').textContent = '开始翻译';

            if (data.code === 0 && data.msg === 'ok') {
              outputText.value = data.text;

              translateBtn.classList.add('success');
              setTimeout(() => { translateBtn.classList.remove('success'); }, 1000);
            } else {
              alert('翻译失败：' + data.msg);
            }
          })
          .catch(error => {
            loadingSpinner.style.display = 'none';
            translateBtn.querySelector('span').textContent = '开始翻译';
            console.error('请求翻译API时发生错误：', error);
            alert('请求翻译API时发生错误，请稍后再试。');
          });
      }

      // 自动设置源语言
      const browserLang = navigator.language.split('-')[0];
      if (browserLang) {
        const options = Array.from(sourceLanguage.options).map(opt => opt.value);
        if (options.includes(browserLang)) {
          sourceLanguage.value = browserLang;
          if (browserLang === targetLanguage.value) {
            targetLanguage.value = browserLang === 'en' ? 'zh' : 'en';
          }
        }
      }
    });
  </script>
</body>
</html>
